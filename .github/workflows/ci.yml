name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run fmt:check

      - name: Build
        run: bun run build

      # `bun run test` (turbo test) includes the e2e Playwright suite, which
      # launches Chromium against the dev server + web app.
      - name: Install Playwright browser
        working-directory: e2e
        run: bun x playwright install --with-deps chromium

      - name: Test
        run: bun run test

      - name: Unit coverage
        run: bun run test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: |
            apps/server/coverage
            apps/mobile/coverage
            apps/web/coverage
            packages/client-runtime/coverage
          if-no-files-found: error
