sonar.exclusions=repos/**,**/routeTree.gen.ts

# Suppress rules that misfire on tooling/conventions SonarCloud's analyzer
# doesn't model. Each entry targets one rule at one path glob.
sonar.issue.ignore.multicriteria=r3f,effectAssert,effectTestFile,voidDiscard,liveMedia,routeIncludes,exportFrom,jsxSpacing,nestedTernary,labelAssoc,groupRole,effectComplexity,effectNesting,renderProp

# react-three-fiber extends JSX with three.js element/props (map, attach,
# shadow-mapSize-*). S6747 ("unknown DOM property") flags every one of them.
sonar.issue.ignore.multicriteria.r3f.ruleKey=typescript:S6747
sonar.issue.ignore.multicriteria.r3f.resourceKey=**/scene/**/*.tsx

# @effect/vitest: `assert.*` from that package isn't recognized as an assertion.
sonar.issue.ignore.multicriteria.effectAssert.ruleKey=typescript:S2699
sonar.issue.ignore.multicriteria.effectAssert.resourceKey=**/*.test.ts

# @effect/vitest: `it.effect(...)` isn't recognized as a test case.
sonar.issue.ignore.multicriteria.effectTestFile.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.effectTestFile.resourceKey=**/*.test.ts

# `void promise` is the deliberate fire-and-forget marker for intentionally
# unawaited effects/promises (satisfies no-floating-promises).
sonar.issue.ignore.multicriteria.voidDiscard.ruleKey=typescript:S3735
sonar.issue.ignore.multicriteria.voidDiscard.resourceKey=**/*

# Live WebRTC/camera <video>/<audio> streams have no caption track to add.
sonar.issue.ignore.multicriteria.liveMedia.ruleKey=typescript:S4084
sonar.issue.ignore.multicriteria.liveMedia.resourceKey=**/room/components/*.tsx

# `.some(r => r === value)` narrows an `unknown`; `.includes(value)` won't type-check.
sonar.issue.ignore.multicriteria.routeIncludes.ruleKey=typescript:S7765
sonar.issue.ignore.multicriteria.routeIncludes.resourceKey=**/audio-output.ts

# Named-const re-export/aliasing (AppRpcs, SendSignalError, barrel re-exports) is
# a deliberate composition point; `export…from` would erase the intent.
sonar.issue.ignore.multicriteria.exportFrom.ruleKey=typescript:S7763
sonar.issue.ignore.multicriteria.exportFrom.resourceKey=**/*.ts

# Ambiguous JSX text spacing is governed by oxfmt; the formatted output is intended.
sonar.issue.ignore.multicriteria.jsxSpacing.ruleKey=typescript:S6772
sonar.issue.ignore.multicriteria.jsxSpacing.resourceKey=**/*.tsx

# Nested ternaries here are idiomatic JSX icon/branch selection.
sonar.issue.ignore.multicriteria.nestedTernary.ruleKey=typescript:S3358
sonar.issue.ignore.multicriteria.nestedTernary.resourceKey=**/*.tsx

# Reusable Label primitive: control association happens at the call site.
sonar.issue.ignore.multicriteria.labelAssoc.ruleKey=typescript:S6853
sonar.issue.ignore.multicriteria.labelAssoc.resourceKey=**/components/label.tsx

# Reusable Field primitive: role="group" is intentional for field grouping.
sonar.issue.ignore.multicriteria.groupRole.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.groupRole.resourceKey=**/components/field.tsx

# Cognitive-complexity thresholds don't model Effect's generator/pipe style; the
# WebRTC signaling and join-negotiation state machines are inherently branchy.
sonar.issue.ignore.multicriteria.effectComplexity.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.effectComplexity.resourceKey=packages/client-runtime/**/*.ts

# Idiomatic Effect pipe nesting in the concurrency-critical room registry transaction.
sonar.issue.ignore.multicriteria.effectNesting.ruleKey=typescript:S2004
sonar.issue.ignore.multicriteria.effectNesting.resourceKey=**/Membership.ts

# CatchBoundary's `errorComponent` is a render prop, not a nested component definition.
sonar.issue.ignore.multicriteria.renderProp.ruleKey=typescript:S6478
sonar.issue.ignore.multicriteria.renderProp.resourceKey=**/room.$roomId.tsx
